<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fluentdat</title>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1a1d23">
  <meta name="description" content="A chat app I am building, Discord style, on GitHub Pages.">
  <link rel="stylesheet" href="app.css?v=abe874d2">
</head>
<body>
  <button class="banner" id="banner"></button>
  <header class="titlebar" id="titlebar"></header>
  <div class="app" id="app">
    <div class="rail-col" id="rail-col"><nav class="rail" id="rail"></nav></div>
    <aside class="side">
      <div class="side-head" id="side-head">Robotics</div>
      <div class="side-body" id="side-body"></div>
      <div class="vpanel" id="vpanel" hidden></div>
      <div class="me" id="me-panel"></div>
    </aside>
    <section class="main">
      <header class="top" id="top"></header>
      <div class="dropzone" id="drop" hidden></div>
      <div class="main-body" id="main-body">
        <div class="main-col" id="main-col">
          <div class="call" id="call"></div>
          <div class="content" id="content"></div>
          <div class="composer" id="composer">
            <div class="mention-pop" id="mention-pop" hidden></div>
            <div class="format-bar" id="format-bar" hidden></div>
            <div class="reply-bar" id="reply-bar" hidden></div>
            <div class="attach-tray" id="attach-tray" hidden></div>
            <div class="rec-bar" id="rec-bar" hidden></div>
            <div class="box">
              <textarea id="input" rows="1" placeholder="Message"></textarea>
              <button class="tool" id="sticker-btn" title="Stickers &amp; emoji"></button>
              <button class="tool send" id="send-btn" title="Send"></button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <aside class="members" id="members"></aside>
  </div>
  <div id="ring" hidden></div>
  <script type="importmap">{ "imports": {

    "./color.js": "./color.js?v=abe874d2",
    "./config.js": "./config.js?v=abe874d2",
    "./datbux.js": "./datbux.js?v=abe874d2",
    "./embeds.js": "./embeds.js?v=abe874d2",
    "./emoji-data.js": "./emoji-data.js?v=abe874d2",
    "./format.js": "./format.js?v=abe874d2",
    "./github.js": "./github.js?v=abe874d2",
    "./logo.js": "./logo.js?v=abe874d2",
    "./media.js": "./media.js?v=abe874d2",
    "./namestyle.js": "./namestyle.js?v=abe874d2",
    "./picker.js": "./picker.js?v=abe874d2",
    "./profilekit.js": "./profilekit.js?v=abe874d2",
    "./shop.js": "./shop.js?v=abe874d2",
    "./store.js": "./store.js?v=abe874d2",
    "./supabase.js": "./supabase.js?v=abe874d2",

  <script type="module" src="app.js?v=abe874d2"></script>
</body>
</html>
