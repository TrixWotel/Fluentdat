<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fluentdat</title>
  <meta name="description" content="A chat app I am building, Discord style, on GitHub Pages.">
  <style>
    :root, :root[data-theme="dark"] {
      --rail: #1a1d23; --side: #20242c; --main: #282d36; --input: #333945; --hover: #2d323c;
      --text: #e8eaee; --muted: #9aa3ae; --bright: #ffffff; --accent: #5b7fd6; --accent-text: #fff; --line: #15171c;
    }
    :root[data-theme="midnight"] { --rail:#05070d; --side:#0a0e18; --main:#0e1320; --input:#182032; --hover:#141c2e; --text:#d7e0f2; --muted:#7d89a6; --bright:#fff; --accent:#6ea8ff; --accent-text:#05070d; --line:#04060b; }
    :root[data-theme="ember"] { --rail:#1b1310; --side:#231915; --main:#2c201a; --input:#3a2a22; --hover:#332419; --text:#f3e6dd; --muted:#b59a89; --bright:#fff; --accent:#e8743b; --accent-text:#1b1310; --line:#140d0a; }
    :root[data-theme="forest"] { --rail:#0f1713; --side:#15201a; --main:#1b2a21; --input:#26382c; --hover:#203128; --text:#e3efe6; --muted:#8fab98; --bright:#fff; --accent:#4bbf73; --accent-text:#0f1713; --line:#0a110d; }
    :root[data-theme="light"] { --rail:#e4e7ec; --side:#eef1f5; --main:#fff; --input:#eef1f5; --hover:#e7ebf1; --text:#1b1f24; --muted:#5b6470; --bright:#000; --accent:#2f6fed; --accent-text:#fff; --line:#d3d8df; }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--main); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    svg.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; flex: none; }
    .app { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--cols, 72px 240px minmax(0, 1fr) 0px); transition: grid-template-columns .15s ease; }
    :root.resizing .app { transition: none; }

    /* server rail */
    .rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; overflow-y: auto; }
    .rail::-webkit-scrollbar { width: 0; }
    .srv { position: relative; width: var(--srv, 46px); height: var(--srv, 46px); border-radius: 15px; background: var(--side); display: grid; place-items: center; overflow: hidden; color: var(--text); font-weight: 700; transition: border-radius .15s, background .15s, color .15s; }
    .srv:hover, .srv.on { border-radius: 14px; background: var(--accent); color: var(--accent-text); }
    .srv img { width: 100%; height: 100%; object-fit: cover; }
    .srv.add, .srv.home { color: var(--muted); background: var(--side); }
    .srv.home.on, .srv.home:hover { background: var(--accent); color: var(--accent-text); }
    .srv.add:hover { background: var(--hover); color: var(--accent); border-radius: 15px; }
    .rail hr { width: 32px; border: none; border-top: 2px solid var(--line); margin: 2px 0; }

    /* sidebar */
    .side { background: var(--side); display: flex; flex-direction: column; min-width: 0; }
    .side-head { padding: 14px 16px; font-weight: 700; color: var(--bright); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; cursor: default; min-height: var(--top-h, 51px); }
    .side-head .drop { margin-left: auto; color: var(--muted); display: grid; place-items: center; }
    .side-head.btn-like { cursor: pointer; }
    .side-head.btn-like:hover { background: var(--hover); }
    .side-body { flex: 1; overflow-y: auto; padding: 8px; }
    .cat { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 14px 6px 4px; display: flex; align-items: center; gap: 3px; cursor: pointer; user-select: none; }
    .cat .caret { transition: transform .12s; display: grid; place-items: center; }
    .cat.collapsed .caret { transform: rotate(-90deg); }
    .cat .nm { flex: 1; }
    .cat .add { color: var(--muted); display: grid; place-items: center; opacity: 0; }
    .cat:hover .add { opacity: 1; }
    .cat .add:hover { color: var(--text); }
    .cat .caret svg.ic, .cat .add svg.ic { width: 13px; height: 13px; }
    .chan { width: 100%; min-height: var(--chan-h, 34px); text-align: left; padding: 4px 10px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .chan:hover { background: var(--hover); color: var(--text); }
    .chan.on { background: var(--hover); color: var(--bright); }
    .chan .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chan .x { opacity: 0; display: grid; place-items: center; }
    .chan .x svg.ic { width: 15px; height: 15px; }
    .chan:hover .x { opacity: .55; }  .chan .x:hover { opacity: 1; }

    /* friends / DM list rows */
    .nav-btn { width: 100%; min-height: calc(var(--chan-h, 34px) + 6px); text-align: left; padding: 6px 10px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .nav-btn:hover { background: var(--hover); color: var(--text); }
    .nav-btn.on { background: var(--hover); color: var(--bright); }
    .dm-row { width: 100%; min-height: calc(var(--chan-h, 34px) + 12px); text-align: left; padding: 5px 8px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
    .dm-row:hover { background: var(--hover); color: var(--text); }
    .dm-row.on { background: var(--hover); color: var(--bright); }
    .dm-row .who { flex: 1; min-width: 0; overflow: hidden; }
    .dm-row .nm2 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* avatars + status */
    .avatar { position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex: none; font-size: .82rem; overflow: visible; }
    .avatar .fill { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .dot { position: absolute; right: -2px; bottom: -2px; width: 13px; height: 13px; border-radius: 50%; border: 3px solid var(--side); }
    .me .dot, .pop .dot { border-color: var(--rail); }
    .dot.online { background: #3ba55d; } .dot.idle { background: #faa81a; } .dot.dnd { background: #ed4245; } .dot.offline, .dot.invisible { background: #747f8d; }

    /* user panel */
    .me { display: flex; align-items: center; gap: 10px; min-height: var(--panel-h, 54px); padding: 6px 12px; background: var(--rail); border-top: 1px solid var(--line); }
    .me .avatar { cursor: pointer; }
    .me .who { flex: 1; min-width: 0; }
    .me .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--bright); }
    .me .st { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .me .gear { color: var(--muted); padding: 6px; border-radius: 8px; }
    .me .gear:hover { color: var(--text); background: var(--hover); }

    /* main */
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--main); }
    .top { height: var(--top-h, 51px); flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); font-weight: 600; color: var(--bright); }
    .top .hash { color: var(--muted); display: grid; place-items: center; }
    .top .spacer { flex: 1; }
    .top .act { color: var(--muted); padding: 7px; border-radius: 8px; display: grid; place-items: center; }
    .top .act:hover, .top .act.on { color: var(--text); background: var(--hover); }
    .content { flex: 1; min-height: 0; overflow-y: auto; }
    .msgs { padding: 16px; display: flex; flex-direction: column; gap: 2px; min-height: 100%; }
    .day { text-align: center; color: var(--muted); font-size: .78rem; margin: 10px 0; }
    .msg { display: flex; gap: 12px; padding: 4px 8px; border-radius: 8px; }
    .msg:hover { background: var(--hover); }
    .msg.cont { padding-top: 0; padding-bottom: 0; }
    .msg.cont .avatar { visibility: hidden; height: 0; }
    .msg .avatar { cursor: pointer; margin-top: 2px; }
    .msg .body { min-width: 0; }
    .msg .meta { display: flex; align-items: baseline; gap: 8px; }
    .msg .nm { font-weight: 600; color: var(--who, var(--bright)); cursor: pointer; }
    .msg .nm:hover { text-decoration: underline; }
    .msg .tag { font-size: .6rem; background: var(--accent); color: var(--accent-text); border-radius: 4px; padding: 1px 4px; text-transform: uppercase; font-weight: 700; }
    .msg .when { font-size: .7rem; color: var(--muted); }
    .msg .text { white-space: pre-wrap; word-wrap: break-word; }
    .msg .text code { background: #0004; padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Menlo, monospace; font-size: .9em; }
    .msg .text.action { font-style: italic; color: var(--muted); }
    .msg .sticker { font-size: 3.4rem; line-height: 1.1; margin-top: 2px; }
    .msg .sticker img { max-width: 150px; max-height: 150px; border-radius: 12px; display: block; }

    /* composer */
    .composer { flex: none; padding: 6px 16px 18px; }
    .box { background: var(--input); border-radius: 12px; display: flex; align-items: flex-end; padding: 4px 6px 4px 14px; gap: 2px; }
    .box textarea { flex: 1; background: none; border: none; color: var(--text); resize: none; font: inherit; padding: 11px 0; max-height: 40dvh; outline: none; min-height: calc(var(--composer-h, 44px) - 8px); }
    .box textarea::placeholder { color: var(--muted); }
    .box .tool { padding: 9px; color: var(--muted); border-radius: 9px; display: grid; place-items: center; }
    .box .tool:hover { color: var(--text); background: var(--hover); }
    .box .tool.send { color: var(--accent); }
    .box .tool.send:hover { color: var(--accent-text); background: var(--accent); }

    /* member list */
    .members { background: var(--side); overflow-y: auto; padding: 14px 8px; }
    .mem-cat { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 12px 8px 4px; }
    .mem { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; width: 100%; }
    .mem:hover { background: var(--hover); }
    .mem .avatar { font-size: .75rem; }
    .mem .nm { font-weight: 600; color: var(--who, var(--text)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mem.off { opacity: .45; }

    /* friends page */
    .friends { padding: 0; }
    .ftabs { display: flex; gap: 6px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .ftab { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; }
    .ftab:hover { background: var(--hover); color: var(--text); }
    .ftab.on { background: var(--hover); color: var(--bright); }
    .ftab.add { background: var(--accent); color: var(--accent-text); }
    .fbody { padding: 16px; }
    .fbody h4 { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px; }
    .frow { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-top: 1px solid var(--line); }
    .frow .nm { font-weight: 600; color: var(--bright); }
    .frow .st2 { color: var(--muted); font-size: .82rem; }
    .frow .acts { margin-left: auto; display: flex; gap: 8px; }
    .frow .acts button { width: 38px; height: 38px; border-radius: 50%; background: var(--input); color: var(--text); display: grid; place-items: center; }
    .frow .acts button:hover { background: var(--hover); color: var(--accent); }
    .add-form { display: flex; gap: 10px; margin-top: 10px; }
    .add-form input { flex: 1; background: var(--input); border: 1px solid var(--line); border-radius: 9px; padding: 11px 14px; color: var(--text); font: inherit; }
    .empty-note { color: var(--muted); text-align: center; padding: 40px 16px; }

    /* call */
    .call { background: #000; border-bottom: 1px solid var(--line); padding: 12px; display: none; flex: none; }
    .call.on { display: block; }
    .call .videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .call video { width: 100%; border-radius: 12px; background: #111; aspect-ratio: 16/10; object-fit: cover; }
    .call .tile { position: relative; } .call .tile span { position: absolute; left: 8px; bottom: 8px; font-size: .75rem; background: #000a; padding: 2px 8px; border-radius: 6px; color: #fff; }
    .call .ctrls { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
    .call .ctrls button { background: var(--input); color: var(--text); width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; }
    .call .ctrls button.off { background: var(--accent); color: var(--accent-text); } .call .ctrls button.leave { background: #e5534b; color: #fff; }
    .call .ctrls svg.ic { width: 22px; height: 22px; }  .call .note { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 8px; }

    /* sticker picker */
    .picker { position: fixed; bottom: 84px; right: 22px; width: 330px; max-height: min(360px, 60dvh); overflow-y: auto; z-index: 15; background: var(--side); border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: 0 18px 50px #0007; }
    .picker .hdr { display: flex; align-items: center; justify-content: space-between; margin: 8px 6px 4px; }
    .picker h4 { margin: 0; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .picker .mk { font-size: .78rem; color: var(--accent); display: flex; align-items: center; gap: 4px; } .picker .mk svg.ic { width: 15px; height: 15px; }
    .picker .set { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; } .picker .set.big { grid-template-columns: repeat(4, 1fr); }
    .picker .set button { font-size: 1.4rem; padding: 6px; border-radius: 8px; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; } .picker .set.big button { font-size: 2rem; }
    .picker .set button img { width: 100%; height: 100%; object-fit: contain; } .picker .set button:hover { background: var(--hover); }
    .picker .empty { color: var(--muted); font-size: .8rem; padding: 6px; }

    /* dialogs */
    .scrim { position: fixed; inset: 0; background: #0008; display: grid; place-items: center; z-index: 60; padding: 20px; }
    .dialog { background: var(--side); border-radius: 16px; padding: 24px; width: 100%; max-width: 460px; max-height: 88dvh; overflow-y: auto; }
    .dialog.wide { max-width: 640px; }
    .dialog h3 { margin: 0 0 16px; color: var(--bright); }
    .field { margin-bottom: 14px; } .field label { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
    .field input, .field textarea { width: 100%; background: var(--input); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; color: var(--text); font: inherit; }
    .field textarea { resize: vertical; min-height: 54px; } .field textarea.code { font-family: ui-monospace, Menlo, monospace; font-size: .86rem; min-height: 120px; }
    .avatar-edit { display: flex; align-items: center; gap: 14px; } .avatar-edit .avatar { width: 64px; height: 64px; font-size: 1.3rem; }
    .swatches, .themes { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatches button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; } .swatches button.on { border-color: var(--bright); }
    .themes button { padding: 8px 12px; border-radius: 9px; background: var(--input); border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; } .themes button.on { border-color: var(--accent); color: var(--bright); }
    .swatch-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #0003; }
    .dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
    .btn { padding: 9px 16px; border-radius: 9px; background: var(--input); } .btn:hover { background: var(--hover); }
    .btn.primary { background: var(--accent); color: var(--accent-text); } .btn.ghost { color: var(--muted); } .btn.danger { color: #e5534b; }
    .vars-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .var-row { display: flex; align-items: center; gap: 8px; font-size: .82rem; } .var-row input[type=color] { width: 34px; height: 30px; padding: 0; border: none; background: none; border-radius: 6px; }
    .var-row label { color: var(--muted); text-transform: none; letter-spacing: 0; margin: 0; }

    /* profile card / account popout */
    .pop { position: fixed; z-index: 40; width: 300px; background: var(--rail); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 18px 50px #0009; }
    .pop .banner-c { height: 60px; }
    .pop .inner { padding: 0 16px 16px; margin-top: -30px; }
    .pop .avatar { width: 74px; height: 74px; font-size: 1.5rem; }
    .pop .avatar .fill { border: 5px solid var(--rail); }
    .pop .pn { font-weight: 800; color: var(--bright); font-size: 1.2rem; margin-top: 10px; display: flex; align-items: center; gap: 6px; }
    .pop .pr { color: var(--muted); font-size: .82rem; }
    .pop .ab { margin-top: 10px; font-size: .88rem; white-space: pre-wrap; }
    .pop .card { background: var(--side); border-radius: 10px; margin-top: 12px; overflow: hidden; }
    .pop .card button { width: 100%; text-align: left; padding: 11px 14px; display: flex; align-items: center; gap: 10px; color: var(--text); }
    .pop .card button:hover { background: var(--hover); }
    .pop .card button svg.ic { width: 18px; height: 18px; color: var(--muted); }
    .pop .card button .chev { margin-left: auto; color: var(--muted); }
    .pop .card hr { border: none; border-top: 1px solid var(--line); margin: 0; }

    .banner { display: flex; align-items: center; justify-content: center; min-height: var(--status-h, 30px); width: 100%; border: none; cursor: pointer; background: var(--accent); color: var(--accent-text); text-align: center; font-size: .82rem; padding: 2px 12px; flex: none; } .banner a { color: inherit; font-weight: 700; }

    /* ---- settings (user + server) ---- */
    .sx-backdrop { position: fixed; inset: 0; z-index: 45; background: rgba(0, 0, 0, .55); display: grid; place-items: center; padding: 24px; animation: sx-fade .15s ease; }
    .sx { position: relative; width: min(1040px, max(74vw, 680px), 100%); height: min(780px, 88vh); background: var(--main); display: grid; grid-template-columns: 250px 1fr;
      border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 24px 80px rgba(0, 0, 0, .55); animation: sx-pop .18s ease; }
    @keyframes sx-fade { from { opacity: 0; } }
    @keyframes sx-pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
    .sx-nav { background: var(--side); overflow-y: auto; padding: 18px 12px 20px; }
    .sx-nav h4 { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 10px 6px; }
    .sx-nav button { width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; gap: 9px; margin-bottom: 2px; }
    .sx-nav button:hover { background: var(--hover); color: var(--text); }
    .sx-nav button.on { background: var(--hover); color: var(--bright); font-weight: 600; }
    .sx-nav button.danger { color: #e5534b; }
    .sx-nav hr { border: none; border-top: 1px solid var(--line); margin: 10px 6px; }
    .sx-me { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
    .sx-me .who { min-width: 0; }
    .sx-me b { display: block; color: var(--bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sx-me .sx-edit { color: var(--muted); font-size: .8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .sx-me .sx-edit:hover { color: var(--text); text-decoration: underline; }
    .sx-body { overflow-y: auto; padding: 26px 64px 50px 34px; }
    .sx-inner { max-width: 720px; }
    .sx-body h2 { margin: 0 0 4px; color: var(--bright); font-size: 1.35rem; }
    .sx-body .sub { color: var(--muted); margin: 0 0 24px; }
    .sx-body h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
    .sx-close { position: absolute; top: 14px; right: 16px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--muted); color: var(--muted); display: grid; place-items: center; background: var(--main); }
    .sx-close:hover { background: var(--hover); color: var(--text); border-color: var(--text); }
    .row2 { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row2 .lbl { flex: 1; min-width: 0; }
    .row2 .lbl b { display: block; color: var(--bright); font-weight: 600; }
    .row2 .lbl span { color: var(--muted); font-size: .85rem; }
    .row2 select, .row2 input[type=text], .row2 input[type=password] { background: var(--input); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--text); font: inherit; min-width: 160px; }
    .row2 input[type=range] { width: 180px; }
    .sw { width: 44px; height: 25px; border-radius: 13px; background: var(--input); position: relative; flex: none; transition: background .15s; }
    .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .sw.on { background: var(--accent); } .sw.on::after { transform: translateX(19px); }

    /* the buttons in the mini screen (each one draggable) */
    .m-bar { display: flex; align-items: center; gap: 2px; min-width: 0; }

    .chip { display: inline-grid; place-items: center; width: calc(var(--chip, 10px) + 4px); height: calc(var(--chip, 10px) + 4px); border-radius: 3px; color: var(--muted); cursor: grab; flex: none; }

  </style>
</head>
