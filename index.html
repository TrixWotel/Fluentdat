<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fluentdat</title>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1a1d23">
  <meta name="description" content="A chat app I am building, Discord style, on GitHub Pages.">
  <style>
    :root, :root[data-theme="dark"] {
      --rail: #1a1d23; --side: #20242c; --main: #282d36; --input: #333945; --hover: #2d323c;
      --text: #e8eaee; --muted: #9aa3ae; --bright: #ffffff; --accent: #5b7fd6; --accent-text: #fff; --line: #15171c;
    }
    :root[data-theme="midnight"] { --rail:#05070d; --side:#0a0e18; --main:#0e1320; --input:#182032; --hover:#141c2e; --text:#d7e0f2; --muted:#7d89a6; --bright:#fff; --accent:#6ea8ff; --accent-text:#05070d; --line:#04060b; }
    :root[data-theme="ember"] { --rail:#1b1310; --side:#231915; --main:#2c201a; --input:#3a2a22; --hover:#332419; --text:#f3e6dd; --muted:#b59a89; --bright:#fff; --accent:#e8743b; --accent-text:#1b1310; --line:#140d0a; }
    :root[data-theme="forest"] { --rail:#0f1713; --side:#15201a; --main:#1b2a21; --input:#26382c; --hover:#203128; --text:#e3efe6; --muted:#8fab98; --bright:#fff; --accent:#4bbf73; --accent-text:#0f1713; --line:#0a110d; }
    :root[data-theme="light"] { --rail:#e4e7ec; --side:#eef1f5; --main:#fff; --input:#eef1f5; --hover:#e7ebf1; --text:#1b1f24; --muted:#5b6470; --bright:#000; --accent:#2f6fed; --accent-text:#fff; --line:#d3d8df; }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--main); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    svg.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; flex: none; }
    .app { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--cols, 72px 240px minmax(0, 1fr) 0px); transition: grid-template-columns .15s ease; }
    :root.resizing .app { transition: none; }

    /* server rail */
    .rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0; overflow-y: auto; }
    .rail::-webkit-scrollbar { width: 0; }
    .srv { position: relative; width: var(--srv, 46px); height: var(--srv, 46px); border-radius: 15px; background: var(--side); display: grid; place-items: center; overflow: hidden; color: var(--text); font-weight: 700; transition: border-radius .15s, background .15s, color .15s; }
    .srv:hover, .srv.on { border-radius: 14px; background: var(--accent); color: var(--accent-text); }
    .srv img { width: 100%; height: 100%; object-fit: cover; }
    .srv.add, .srv.home { color: var(--muted); background: var(--side); }
    .srv.home.on, .srv.home:hover { background: var(--accent); color: var(--accent-text); }
    .srv.add:hover { background: var(--hover); color: var(--accent); border-radius: 15px; }
    .rail hr { width: 32px; border: none; border-top: 2px solid var(--line); margin: 2px 0; }

    /* sidebar */
    .side { background: var(--side); display: flex; flex-direction: column; min-width: 0; }
    .side-head { padding: 14px 16px; font-weight: 700; color: var(--bright); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; cursor: default; min-height: var(--top-h, 51px); }
    .side-head .drop { margin-left: auto; color: var(--muted); display: grid; place-items: center; }
    .side-head.btn-like { cursor: pointer; }
    .side-head.btn-like:hover { background: var(--hover); }
    .side-body { flex: 1; overflow-y: auto; padding: 8px; }
    .cat { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 14px 6px 4px; display: flex; align-items: center; gap: 3px; cursor: pointer; user-select: none; }
    .cat .caret { transition: transform .12s; display: grid; place-items: center; }
    .cat.collapsed .caret { transform: rotate(-90deg); }
    .cat .nm { flex: 1; }
    .cat .add { color: var(--muted); display: grid; place-items: center; opacity: 0; }
    .cat:hover .add { opacity: 1; }
    .cat .add:hover { color: var(--text); }
    .cat .caret svg.ic, .cat .add svg.ic { width: 13px; height: 13px; }
    .chan { width: 100%; min-height: var(--chan-h, 34px); text-align: left; padding: 4px 10px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .chan:hover { background: var(--hover); color: var(--text); }
    .chan.on { background: var(--hover); color: var(--bright); }
    .chan .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chan .x { opacity: 0; display: grid; place-items: center; }
    .chan .x svg.ic { width: 15px; height: 15px; }
    .chan:hover .x { opacity: .55; }  .chan .x:hover { opacity: 1; }

    /* friends / DM list rows */
    .nav-btn { width: 100%; min-height: calc(var(--chan-h, 34px) + 6px); text-align: left; padding: 6px 10px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .nav-btn:hover { background: var(--hover); color: var(--text); }
    .nav-btn.on { background: var(--hover); color: var(--bright); }
    .dm-row { width: 100%; min-height: calc(var(--chan-h, 34px) + 12px); text-align: left; padding: 5px 8px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
    .dm-row:hover { background: var(--hover); color: var(--text); }
    .dm-row.on { background: var(--hover); color: var(--bright); }
    .dm-row .who { flex: 1; min-width: 0; overflow: hidden; }
    .dm-row .nm2 { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* avatars + status */
    .avatar { position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex: none; font-size: .82rem; overflow: visible; }
    .avatar .fill { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .dot { position: absolute; right: -2px; bottom: -2px; width: 13px; height: 13px; border-radius: 50%; border: 3px solid var(--side); }
    .me .dot, .pop .dot { border-color: var(--rail); }
    .dot.online { background: #3ba55d; } .dot.idle { background: #faa81a; } .dot.dnd { background: #ed4245; } .dot.offline, .dot.invisible { background: #747f8d; }

    /* user panel */
    .me { display: flex; align-items: center; gap: 10px; min-height: var(--panel-h, 54px); padding: 6px 12px; background: var(--rail); border-top: 1px solid var(--line); }
    .me .avatar { cursor: pointer; }
    .me .who { flex: 1; min-width: 0; }
    .me .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--bright); }
    .me .st { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .me .gear { color: var(--muted); padding: 6px; border-radius: 8px; }
    .me .gear:hover { color: var(--text); background: var(--hover); }

    /* main */
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--main); }
    .top { height: var(--top-h, 51px); flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); font-weight: 600; color: var(--bright); }
    .top .hash { color: var(--muted); display: grid; place-items: center; }
    .top .spacer { flex: 1; }
    .top .act { color: var(--muted); padding: 7px; border-radius: 8px; display: grid; place-items: center; }
    .top .act:hover, .top .act.on { color: var(--text); background: var(--hover); }
    .content { flex: 1; min-height: 0; overflow-y: auto; }
    .msgs { padding: 16px; display: flex; flex-direction: column; gap: 2px; min-height: 100%; }
    .day { text-align: center; color: var(--muted); font-size: .78rem; margin: 10px 0; }
    .msg { display: flex; gap: 12px; padding: 4px 8px; border-radius: 8px; }
    .msg:hover { background: var(--hover); }
    .msg.cont { padding-top: 0; padding-bottom: 0; }
    .msg.cont .avatar { visibility: hidden; height: 0; }
    .msg .avatar { cursor: pointer; margin-top: 2px; }
    .msg .body { min-width: 0; }
    .msg .meta { display: flex; align-items: baseline; gap: 8px; }
    .msg .nm { font-weight: 600; color: var(--who, var(--bright)); cursor: pointer; }
    .msg .nm:hover { text-decoration: underline; }
    .msg .tag { font-size: .6rem; background: var(--accent); color: var(--accent-text); border-radius: 4px; padding: 1px 4px; text-transform: uppercase; font-weight: 700; }
    .msg .when { font-size: .7rem; color: var(--muted); }
    .msg .text { white-space: pre-wrap; word-wrap: break-word; }
    .msg .text code { background: #0004; padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Menlo, monospace; font-size: .9em; }
    .msg .text.action { font-style: italic; color: var(--muted); }
    .msg .sticker { font-size: 3.4rem; line-height: 1.1; margin-top: 2px; }
    .msg .sticker img { max-width: 150px; max-height: 150px; border-radius: 12px; display: block; }

    /* composer */
    .composer { flex: none; padding: 6px 16px 18px; }
    .box { background: var(--input); border-radius: 12px; display: flex; align-items: flex-end; padding: 4px 6px 4px 14px; gap: 2px; }
    .box textarea { flex: 1; background: none; border: none; color: var(--text); resize: none; font: inherit; padding: 11px 0; max-height: 40dvh; outline: none; min-height: calc(var(--composer-h, 44px) - 8px); }
    .box textarea::placeholder { color: var(--muted); }
    .box .tool { padding: 9px; color: var(--muted); border-radius: 9px; display: grid; place-items: center; }
    .box .tool:hover { color: var(--text); background: var(--hover); }
    .box .tool.send { color: var(--accent); }
    .box .tool.send:hover { color: var(--accent-text); background: var(--accent); }

    /* member list */
    .members { background: var(--side); overflow-y: auto; padding: 14px 8px; }
    .mem-cat { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 12px 8px 4px; }
    .mem { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; width: 100%; }
    .mem:hover { background: var(--hover); }
    .mem .avatar { font-size: .75rem; }
    .mem .nm { font-weight: 600; color: var(--who, var(--text)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mem.off { opacity: .45; }

    /* friends page */
    .friends { padding: 0; }
    .ftabs { display: flex; gap: 6px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .ftab { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 600; }
    .ftab:hover { background: var(--hover); color: var(--text); }
    .ftab.on { background: var(--hover); color: var(--bright); }
    .ftab.add { background: var(--accent); color: var(--accent-text); }
    .fbody { padding: 16px; }
    .fbody h4 { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px; }
    .frow { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-top: 1px solid var(--line); }
    .frow .nm { font-weight: 600; color: var(--bright); }
    .frow .st2 { color: var(--muted); font-size: .82rem; }
    .frow .acts { margin-left: auto; display: flex; gap: 8px; }
    .frow .acts button { width: 38px; height: 38px; border-radius: 50%; background: var(--input); color: var(--text); display: grid; place-items: center; }
    .frow .acts button:hover { background: var(--hover); color: var(--accent); }
    .add-form { display: flex; gap: 10px; margin-top: 10px; }
    .add-form input { flex: 1; background: var(--input); border: 1px solid var(--line); border-radius: 9px; padding: 11px 14px; color: var(--text); font: inherit; }
    .empty-note { color: var(--muted); text-align: center; padding: 40px 16px; }

    /* sticker picker */
    .picker { position: fixed; bottom: 84px; right: 22px; width: 330px; max-height: min(360px, 60dvh); overflow-y: auto; z-index: 15; background: var(--side); border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: 0 18px 50px #0007; }
    .picker .hdr { display: flex; align-items: center; justify-content: space-between; margin: 8px 6px 4px; }
    .picker h4 { margin: 0; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .picker .mk { font-size: .78rem; color: var(--accent); display: flex; align-items: center; gap: 4px; } .picker .mk svg.ic { width: 15px; height: 15px; }
    .picker .set { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; } .picker .set.big { grid-template-columns: repeat(4, 1fr); }
    .picker .set button { font-size: 1.4rem; padding: 6px; border-radius: 8px; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; } .picker .set.big button { font-size: 2rem; }
    .picker .set button img { width: 100%; height: 100%; object-fit: contain; } .picker .set button:hover { background: var(--hover); }
    .picker .empty { color: var(--muted); font-size: .8rem; padding: 6px; }

    /* dialogs */
    .scrim { position: fixed; inset: 0; background: #0008; display: grid; place-items: center; z-index: 60; padding: 20px; }
    .dialog { background: var(--side); border-radius: 16px; padding: 24px; width: 100%; max-width: 460px; max-height: 88dvh; overflow-y: auto; }
    .dialog.wide { max-width: 640px; }
    .dialog h3 { margin: 0 0 16px; color: var(--bright); }
    .field { margin-bottom: 14px; } .field label { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
    .field input, .field textarea { width: 100%; background: var(--input); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; color: var(--text); font: inherit; }
    .field textarea { resize: vertical; min-height: 54px; } .field textarea.code { font-family: ui-monospace, Menlo, monospace; font-size: .86rem; min-height: 120px; }
    .avatar-edit { display: flex; align-items: center; gap: 14px; } .avatar-edit .avatar { width: 64px; height: 64px; font-size: 1.3rem; }
    .swatches, .themes { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatches button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; } .swatches button.on { border-color: var(--bright); }
    .themes button { padding: 8px 12px; border-radius: 9px; background: var(--input); border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; } .themes button.on { border-color: var(--accent); color: var(--bright); }
    .swatch-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #0003; }
    .dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
    .btn { padding: 9px 16px; border-radius: 9px; background: var(--input); } .btn:hover { background: var(--hover); }
    .btn.primary { background: var(--accent); color: var(--accent-text); } .btn.ghost { color: var(--muted); } .btn.danger { color: #e5534b; }
    .vars-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .var-row { display: flex; align-items: center; gap: 8px; font-size: .82rem; } .var-row input[type=color] { width: 34px; height: 30px; padding: 0; border: none; background: none; border-radius: 6px; }
    .var-row label { color: var(--muted); text-transform: none; letter-spacing: 0; margin: 0; }

    /* profile card / account popout */
    .pop { position: fixed; z-index: 40; width: 300px; background: var(--rail); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 18px 50px #0009; }
    .pop .banner-c { height: 60px; }
    .pop .inner { padding: 0 16px 16px; margin-top: -30px; }
    .pop .avatar { width: 74px; height: 74px; font-size: 1.5rem; }
    .pop .avatar .fill { border: 5px solid var(--rail); }
    .pop .pn { font-weight: 800; color: var(--bright); font-size: 1.2rem; margin-top: 10px; display: flex; align-items: center; gap: 6px; }
    .pop .pr { color: var(--muted); font-size: .82rem; }
    .pop .ab { margin-top: 10px; font-size: .88rem; white-space: pre-wrap; }
    .pop .card { background: var(--side); border-radius: 10px; margin-top: 12px; overflow: hidden; }
    .pop .card button { width: 100%; text-align: left; padding: 11px 14px; display: flex; align-items: center; gap: 10px; color: var(--text); }
    .pop .card button:hover { background: var(--hover); }
    .pop .card button svg.ic { width: 18px; height: 18px; color: var(--muted); }
    .pop .card button .chev { margin-left: auto; color: var(--muted); }
    .pop .card hr { border: none; border-top: 1px solid var(--line); margin: 0; }

    .banner { display: flex; align-items: center; justify-content: center; min-height: var(--status-h, 30px); width: 100%; border: none; cursor: pointer; background: var(--accent); color: var(--accent-text); text-align: center; font-size: .82rem; padding: 2px 12px; flex: none; } .banner a { color: inherit; font-weight: 700; }

    /* ---- settings (user + server) ---- */
    .sx-backdrop { position: fixed; inset: 0; z-index: 45; background: rgba(0, 0, 0, .55); display: grid; place-items: center; padding: 24px; animation: sx-fade .15s ease; }
    .sx { position: relative; width: min(1040px, max(74vw, 680px), 100%); height: min(780px, 88vh); background: var(--main); display: grid; grid-template-columns: 250px 1fr;
      border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 24px 80px rgba(0, 0, 0, .55); animation: sx-pop .18s ease; }
    @keyframes sx-fade { from { opacity: 0; } }
    @keyframes sx-pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
    .sx-nav { background: var(--side); overflow-y: auto; padding: 18px 12px 20px; }
    .sx-nav h4 { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 10px 6px; }
    .sx-nav button { width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; gap: 9px; margin-bottom: 2px; }
    .sx-nav button:hover { background: var(--hover); color: var(--text); }
    .sx-nav button.on { background: var(--hover); color: var(--bright); font-weight: 600; }
    .sx-nav button.danger { color: #e5534b; }
    .sx-nav hr { border: none; border-top: 1px solid var(--line); margin: 10px 6px; }
    .sx-me { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
    .sx-me .who { min-width: 0; }
    .sx-me b { display: block; color: var(--bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sx-me .sx-edit { color: var(--muted); font-size: .8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .sx-me .sx-edit:hover { color: var(--text); text-decoration: underline; }
    .sx-body { overflow-y: auto; padding: 26px 64px 50px 34px; }
    .sx-inner { max-width: 720px; }
    .sx-body h2 { margin: 0 0 4px; color: var(--bright); font-size: 1.35rem; }
    .sx-body .sub { color: var(--muted); margin: 0 0 24px; }
    .sx-body h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
    .sx-close { position: absolute; top: 14px; right: 16px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--muted); color: var(--muted); display: grid; place-items: center; background: var(--main); }
    .sx-close:hover { background: var(--hover); color: var(--text); border-color: var(--text); }
    .row2 { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row2 .lbl { flex: 1; min-width: 0; }
    .row2 .lbl b { display: block; color: var(--bright); font-weight: 600; }
    .row2 .lbl span { color: var(--muted); font-size: .85rem; }
    .row2 select, .row2 input[type=text], .row2 input[type=password] { background: var(--input); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--text); font: inherit; min-width: 160px; }
    .row2 input[type=range] { width: 180px; }
    .sw { width: 44px; height: 25px; border-radius: 13px; background: var(--input); position: relative; flex: none; transition: background .15s; }
    .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .sw.on { background: var(--accent); } .sw.on::after { transform: translateX(19px); }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: .8rem; background: var(--input); color: var(--muted); }
    .chip.good { background: #3ba55d22; color: #3ba55d; } .chip.bad { background: #ed424522; color: #ed4245; }
    .sx-list { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .sx-list .it { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .sx-list .it:last-child { border-bottom: none; }
    .sx-list .it .nm3 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sx-list .it button { color: var(--muted); padding: 5px; border-radius: 6px; display: grid; place-items: center; }
    .sx-list .it button:hover { color: var(--text); background: var(--hover); }

    /* ---- signing in (Discord, GitHub, email) ---- */

    /* ---- layout you can change (Settings → Layout). Every switch below really moves something. ---- */
    :root { --rail-w: 72px; --side-w: 240px; --members-w: 232px; --avatar: 36px; --mem-av: 32px; --r: 10px; --msg-max: none; }

    :root[data-rail="off"] .rail { display: none; }

    :root[data-topbar="off"] .top { display: none; }

    :root[data-radius] .chan, :root[data-radius] .dm-row, :root[data-radius] .nav-btn, :root[data-radius] .btn, :root[data-radius] .box, :root[data-radius] .msg, :root[data-radius] .mem { border-radius: var(--r); }

    :root[data-uifont="rounded"] body { font-family: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, sans-serif; }

    /* preferences that actually change things */
    :root[data-density="compact"] .msg { padding-top: 1px; padding-bottom: 1px; }

    :root[data-density="compact"] .msgs { gap: 0; }
    :root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after { transition: none !important; animation: none !important; }
    :root[data-contrast="high"] { --muted: var(--text); }

    /* ---- windows, buttons, menus ---- */
    .btn.red { background: #da373c; color: #fff; } .btn.red:hover { background: #a12828; } .btn:disabled { opacity: .55; cursor: default; }
    .btn.small { padding: 6px 12px; font-size: .86rem; display: inline-flex; align-items: center; gap: 6px; }
    .btn.wide { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
    .btn.ghost.danger { color: #e5534b; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .dlg-sub { color: var(--muted); margin: -8px 0 16px; font-size: .9rem; }

    .dialog .center, .dialog.center-title h3 { text-align: center; } .dialog p.center { text-align: center; }

    textarea.area, input.wide-in { width: 100%; background: var(--input); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; color: var(--text); font: inherit; }

    .dialog textarea { width: 100%; background: var(--input); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; color: var(--text); font: inherit; min-height: 70px; resize: vertical; }
    .ctx { position: fixed; z-index: 80; min-width: 200px; max-width: 280px; background: var(--rail); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 12px 34px #0009; }

    .ctx button:hover:not(:disabled) { background: var(--accent); color: var(--accent-text); }

    /* ---- server rail extras, the banner header, channel hover buttons, DMs ---- */
    .srv.discover { color: #3ba55d; } .srv.discover:hover, .srv.discover.on { background: #3ba55d; color: #fff; border-radius: 15px; }

    /* nameplates: a picture or gradient behind a row, faded so names stay readable */

    .sx-list .it .chip { display: inline-flex; align-items: center; gap: 4px; }

    .role-list { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }

    .role-pill i { width: 12px; height: 12px; border-radius: 50%; } .role-pill small { color: var(--muted); font-weight: 500; }
    .role-pill.on { background: var(--hover); box-shadow: 0 0 0 2px var(--accent); }

    /* ---- the layout studio: a mini screen of the whole app ---- */
    .members.collapsed { padding: 0; overflow: hidden; }
    .studio { margin: 6px 0 8px; }

    .seg button { padding: 5px 11px; border-radius: 7px; color: var(--muted); font-weight: 600; font-size: .82rem; }
    .seg button.on { background: var(--hover); color: var(--bright); }
    .studio-hint { color: var(--muted); font-size: .8rem; margin: 0 0 8px; min-height: 1.2em; }
    .mini-wrap { display: flex; justify-content: center; }
    .mini { position: relative; background: var(--main); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 12px 34px #0007; user-select: none; touch-action: none; font-size: 9px; line-height: 1.2; }
    .mp { position: absolute; overflow: hidden; cursor: grab; }

    .mp:hover { box-shadow: inset 0 0 0 1px #ffffff40; }
    .mp.sel { box-shadow: inset 0 0 0 2px var(--accent); z-index: 1; }
    .mp.off { opacity: .55; background-image: repeating-linear-gradient(45deg, #ffffff1a 0 4px, transparent 4px 8px) !important; }
    .mp.lifting { opacity: .35; }
    .m-status { background: var(--accent); color: var(--accent-text); display: grid; place-items: center; }
    .m-tag { font-size: 8px; opacity: .9; white-space: nowrap; }
    .m-rail { background: var(--rail); padding-top: 6px; }
    .m-side { background: var(--side); display: flex; flex-direction: column; }
    .m-head { border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 3px; padding: 4px 5px; color: var(--bright); font-weight: 700; }
    .m-head.bannered { color: #fff; text-shadow: 0 1px 2px #000; }
    .m-head:not(.bannered) { align-items: center; }
    .m-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .m-body { flex: 1 !important; padding: 3px; display: flex; flex-direction: column; gap: 1px; }
    .m-cat { font-size: 7px; color: var(--muted); letter-spacing: .04em; padding: 4px 3px 2px; white-space: nowrap; display: flex; align-items: center; gap: 2px; }
    .m-cat > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .m-chan { display: flex; align-items: center; gap: 3px; padding: 0 4px; border-radius: 3px; color: var(--muted); white-space: nowrap; overflow: hidden; flex: none; }
    .m-chan.on { background: var(--hover); color: var(--bright); }
    .m-chan span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .m-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
    .m-panel { background: var(--rail); display: flex; align-items: center; padding: 0 4px; }
    .m-main { display: flex; flex-direction: column; background: var(--main); }
    .m-top { display: flex; align-items: center; gap: 3px; padding: 0 5px; border-bottom: 1px solid var(--line); color: var(--bright); font-weight: 700; }
    .m-title { white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
    .m-top .m-bar, .m-panel .m-bar, .m-head .m-bar { flex: none; }
    .m-panel .m-bar { flex: 1; min-width: 0; }
    .m-content { flex: 1 !important; padding: 6px; display: flex; flex-direction: column; gap: 5px; justify-content: flex-end; }
    .m-msg { display: flex; gap: 5px; align-items: flex-start; }
    .m-av { border-radius: 50%; background: var(--accent); flex: none; display: block; }
    .m-lines { flex: 1; display: grid; gap: 2px; }
    .m-lines b, .m-lines span { display: block; border-radius: 2px; background: var(--muted); opacity: .35; }
    .m-lines b { opacity: .7; background: var(--bright); }
    .m-composer { padding: 3px 6px 6px; display: flex; flex-direction: column; justify-content: flex-end; }
    .m-box { background: var(--input); border-radius: 5px; flex: 1; display: flex; align-items: flex-end; padding: 2px; min-height: 0; }
    .m-members { background: var(--side); padding: 4px; display: flex; flex-direction: column; gap: 3px; }
    .m-mem { display: flex; align-items: center; gap: 4px; padding: 2px; border-radius: 3px; }
    .m-mem b { height: 5px; width: 55%; border-radius: 2px; background: var(--muted); opacity: .6; }
    .m-dp { display: flex; flex-direction: column; gap: 3px; }
    .m-dp-banner { height: 26px; background: var(--accent); margin: -4px -4px 0; }
    .m-dp-av { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 2px solid var(--side); margin-top: -12px; display: block; }
    .m-dp b, .m-dp span { height: 5px; border-radius: 2px; background: var(--muted); opacity: .6; width: 60%; display: block; }
    .m-dp span { width: 40%; opacity: .35; }
    /* the buttons in the mini screen (each one draggable) */
    .m-bar { display: flex; align-items: center; gap: 2px; min-width: 0; }
    .m-bar.vertical { flex-direction: column; gap: 3px; width: 100%; }
    .m-bar.inbox { width: 100%; align-items: flex-end; }
    .m-bar.inline { margin-left: auto; }
    .m-bar.find { width: 100%; }
    .chip { display: inline-grid; place-items: center; width: calc(var(--chip, 10px) + 4px); height: calc(var(--chip, 10px) + 4px); border-radius: 3px; color: var(--muted); cursor: grab; flex: none; }
    .chip:hover { background: #ffffff1c; color: var(--bright); }
    .chip svg.ic { width: var(--chip, 10px); height: var(--chip, 10px); }
    .chip.na { opacity: .35; }
    .chip.lifting { opacity: .25; }
    .m-rail .chip { width: var(--chip); height: var(--chip); border-radius: 30%; background: var(--side); }
    .m-rail .chip svg.ic { width: 55%; height: 55%; }
    .chip.wide[data-chip="servers"] { height: auto; flex-direction: column; justify-content: center; gap: 3px; background: none; overflow: visible; }
    .chip.wide[data-chip="servers"] i { width: var(--chip); height: var(--chip); border-radius: 30%; background: var(--accent); display: block; opacity: .85; }
    .chip.wide[data-chip="servers"] i + i { opacity: .55; }
    .chip.wide { display: flex; align-items: center; justify-content: flex-start; min-width: 0; overflow: hidden; }
    .chip.wide[data-chip="input"] { flex: 1; width: auto; padding: 0 4px; color: var(--muted); }
    .chip.wide[data-chip="me"] { flex: 1 1 0; width: auto; gap: 3px; color: var(--bright); }
    .chip.wide[data-chip="me"] i { width: calc(var(--chip) + 2px); height: calc(var(--chip) + 2px); border-radius: 50%; background: var(--accent); display: block; flex: none; }
    .chip.wide[data-chip="findDM"] { flex: 1; width: auto; background: var(--rail); padding: 0 4px; height: 13px; }
    .chip em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* resize handles */
    .m-handle { position: absolute; z-index: 4; }
    .m-handle.v { width: 12px; margin-left: -6px; cursor: ew-resize; }
    .m-handle.h { height: 12px; margin-top: -6px; cursor: ns-resize; }
    .m-handle::after { content: ''; position: absolute; background: var(--accent); opacity: 0; transition: opacity .12s; border-radius: 2px; }
    .m-handle.v::after { left: 5px; top: 0; bottom: 0; width: 2px; }
    .m-handle.h::after { top: 5px; left: 0; right: 0; height: 2px; }
    .m-handle:hover::after, :root.resizing .m-handle::after { opacity: .9; }
    .mini:hover .m-handle::after { opacity: .35; }
    .m-handle.thin.h { height: 8px; margin-top: -4px; } .m-handle.thin.h::after { top: 3px; }
    .m-grip { position: absolute; z-index: 5; width: 11px; height: 11px; margin: -6px 0 0 -6px; border-radius: 3px; background: var(--accent); border: 2px solid var(--main); cursor: nwse-resize; }
    .m-drop { position: absolute; z-index: 6; background: var(--accent); border-radius: 2px; box-shadow: 0 0 0 1px #0006; pointer-events: none; }
    .m-ghost { position: fixed !important; z-index: 95; pointer-events: none; opacity: .9; box-shadow: 0 10px 30px #000a; border-radius: 6px; }
    /* the tray of hidden things, and the settings for what's selected */
    .tray { margin-top: 10px; min-height: 42px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 7px 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: .84rem; touch-action: none; }
    .tray.over { border-color: var(--accent); background: #ffffff0a; }
    .tray-lbl { margin-right: 4px; }
    .tchip { width: auto; height: auto; display: inline-flex; gap: 6px; align-items: center; padding: 4px 9px; background: var(--input); color: var(--text); border-radius: 7px; --chip: 15px; }
    .tchip.part { color: var(--bright); }
    .insp { margin-top: 14px; background: var(--side); border-radius: 12px; padding: 4px 16px 12px; }
    .insp-head { display: flex; align-items: baseline; gap: 10px; }
    .insp-head h3 { margin: 14px 0 4px !important; color: var(--bright) !important; font-size: .95rem !important; text-transform: none !important; letter-spacing: 0 !important; }
    .slide { display: flex; align-items: center; gap: 10px; } .slide input[type=range] { width: 170px; }
    .slide .val { min-width: 48px; text-align: right; color: var(--bright); font-variant-numeric: tabular-nums; font-size: .86rem; }


    /* ===== the rail: pills, counts, voice, unread DMs, name tags ===== */
    .srv-wrap { position: relative; width: 100%; display: flex; justify-content: center; flex: none; }
    .srv-wrap .pill { position: absolute; left: 0; top: 50%; width: 4px; height: 0; border-radius: 0 4px 4px 0; background: var(--bright); transform: translateY(-50%); transition: height .15s ease; }
    .srv-wrap.unread .pill { height: 8px; } .srv-wrap:hover .pill { height: 20px; } .srv-wrap.on .pill { height: 40px; }
    .srv-wrap .badge { position: absolute; bottom: -3px; right: calc(50% - var(--srv, 46px) / 2 - 5px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #f23f43; color: #fff; font-size: .7rem; font-weight: 800; display: grid; place-items: center; border: 3px solid var(--rail); box-sizing: content-box; pointer-events: none; }
    .srv-wrap .vbadge { position: absolute; top: -3px; right: calc(50% - var(--srv, 46px) / 2 - 5px); width: 20px; height: 20px; border-radius: 50%; background: #23a55a; color: #fff; display: grid; place-items: center; border: 3px solid var(--rail); pointer-events: none; }
    .srv-wrap .vbadge svg.ic { width: 11px; height: 11px; }
    .srv.dmu { background: none; padding: 0; } .srv.dmu .avatar { width: 100%; height: 100%; } .srv.dmu .avatar .fill { font-size: 1rem; } .srv.dmu .dot { display: none; }
    .tip { position: fixed; z-index: 90; background: #111214; color: #f2f3f5; border-radius: 8px; padding: 8px 12px; font-size: .9rem; box-shadow: 0 8px 24px #0008; pointer-events: none; max-width: 260px; }
    .tip::before { content: ''; position: absolute; left: -5px; top: 50%; margin-top: -5px; border: 5px solid transparent; border-left: 0; border-right-color: #111214; }
    .tip b { display: block; font-weight: 700; }
    .tip-voice { display: flex; align-items: center; gap: 6px; color: #b5bac1; font-size: .82rem; margin-top: 8px; } .tip-voice svg.ic { width: 14px; height: 14px; }
    .tip-people { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; } .tip-people .avatar { font-size: .55rem; }

    /* ===== channels: unread, pings, muted, the cog, voice people ===== */
    .chan.unread { color: var(--bright); font-weight: 700; position: relative; }
    .chan.unread::before { content: ''; position: absolute; left: -8px; top: 50%; width: 4px; height: 8px; margin-top: -4px; border-radius: 0 4px 4px 0; background: var(--bright); }
    .chan.muted { opacity: .45; } .chan.muted:hover, .chan.muted.on { opacity: .8; }
    .chan.joined { color: var(--bright); }
    .mbadge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #f23f43; color: #fff; font-size: .7rem; font-weight: 800; display: inline-grid; place-items: center; flex: none; }
    .chan .x.cs { margin-left: 0; }
    .chan.on .x, .chan:hover .x { opacity: .55; }
    .vmem { width: calc(100% - 24px); margin: 1px 0 1px 24px; display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 6px; color: var(--muted); font-size: .88rem; text-align: left; }
    .vmem:hover { background: var(--hover); color: var(--text); }
    .vmem .avatar { box-shadow: 0 0 0 2px transparent; transition: box-shadow .1s; } .vmem.speaking .avatar { box-shadow: 0 0 0 2px #23a55a; }
    .vmem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vmem .vic { display: grid; place-items: center; } .vmem .vic svg.ic { width: 14px; height: 14px; } .vmem .vic.red { color: #f23f43; }
    .vmem .live { background: #f23f43; color: #fff; font-size: .6rem; font-weight: 800; border-radius: 4px; padding: 1px 5px; }
    .nav-btn .grow, .grow { flex: 1; min-width: 0; }
    .dm-row { position: relative; }
    .dm-row.unread .nm2 { color: var(--bright); }
    .dm-row .close { opacity: 0; color: var(--muted); display: grid; place-items: center; margin-left: auto; } .dm-row:hover .close { opacity: .7; } .dm-row .close:hover { opacity: 1; color: var(--text); }
    .dm-row .sub2.good { color: #23a55a; }
    .avatar.group-av .fill { color: #fff; }

    /* ===== Voice Connected ===== */
    .vpanel { background: var(--rail); border-top: 1px solid var(--line); padding: 8px 10px; display: grid; gap: 6px; }
    .vp-top { display: flex; align-items: center; gap: 8px; }
    .vp-what { flex: 1; min-width: 0; }
    .vp-status { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: .86rem; color: #f0b232; } .vp-status.good { color: #23a55a; } .vp-status svg.ic { width: 15px; height: 15px; }
    .vp-where { display: block; max-width: 100%; color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; padding: 0; }
    .vp-where:hover { color: var(--text); text-decoration: underline; }
    .vp-row { display: flex; gap: 6px; }
    .vp-btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: var(--side); color: var(--text); font-size: .82rem; font-weight: 600; }
    .vp-btn:hover { background: var(--hover); } .vp-btn.wide { flex: 1; } .vp-btn.on { background: #23a55a; color: #fff; }
    .vp-btn.hang { background: none; color: var(--muted); padding: 6px; } .vp-btn.hang:hover { color: #f23f43; background: var(--hover); }
    .vp-warn { color: #f0b232; font-size: .76rem; }

    /* ===== the top bar ===== */
    .top .topic-sep { width: 1px; height: 22px; background: var(--line); flex: none; }
    .top .topic { color: var(--muted); font-weight: 500; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; text-align: left; padding: 0; }
    .top .topic:hover { color: var(--text); }
    .top .ttl-edit { color: var(--bright); font-weight: 600; padding: 0; text-align: left; } .top .ttl-edit:hover { text-decoration: underline; }
    .top .act.incall { color: #23a55a; }
    .topic-full { line-height: 1.5; }

    /* ===== messages ===== */
    .msg { display: grid; grid-template-columns: var(--avatar, 36px) minmax(0, 1fr); column-gap: 12px; row-gap: 0; position: relative; }
    .msg > .avatar { grid-column: 1; grid-row: 2; }
    .msg > .body { grid-column: 2; grid-row: 2; }
    .msg > .reply-line { grid-column: 1 / -1; grid-row: 1; }
    :root[data-avatars="off"] .msg { grid-template-columns: minmax(0, 1fr); } :root[data-avatars="off"] .msg > .body { grid-column: 1; }
    .msg.pinged { background: #f0b2321a; box-shadow: inset 2px 0 0 #f0b232; } .msg.pinged:hover { background: #f0b23226; }
    .msg.sending .text, .msg.sending .atts { opacity: .55; }
    .msg.flash { animation: flash 1.6s ease; } @keyframes flash { 0%, 40% { background: #5865f233; } }
    .msg-tools { position: absolute; top: -14px; right: 14px; display: none; background: var(--side); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 10px #0004; z-index: 2; }
    .msg:hover .msg-tools { display: flex; }
    .msg-tools button { padding: 5px 7px; color: var(--muted); display: grid; place-items: center; } .msg-tools button:hover { color: var(--text); background: var(--hover); }
    .reply-line { display: flex; align-items: center; gap: 5px; font-size: .82rem; color: var(--muted); margin: 2px 0 -2px calc(var(--avatar, 36px) / 2 + 2px); min-width: 0; cursor: pointer; }
    .reply-line .rl-curve { width: 28px; height: 10px; border-left: 2px solid #4e5058; border-top: 2px solid #4e5058; border-top-left-radius: 6px; margin-top: 8px; flex: none; }
    .reply-line .rl-name { color: var(--who, var(--text)); font-weight: 600; white-space: nowrap; }
    .reply-line .rl-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .reply-line:hover .rl-text { color: var(--text); } .reply-line .rl-gone { font-style: italic; }
    .reply-line .avatar .dot { display: none; } .reply-line .avatar .fill { font-size: .45rem; }
    .day { display: flex; align-items: center; gap: 8px; } .day::before, .day::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
    .newline { display: flex; align-items: center; margin: 8px 0; border-top: 1px solid #f23f43; height: 0; position: relative; }
    .newline span { position: absolute; right: 0; top: -9px; background: #f23f43; color: #fff; font-size: .62rem; font-weight: 800; padding: 1px 5px; border-radius: 4px; }
